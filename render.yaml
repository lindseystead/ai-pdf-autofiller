services:
  - type: web
    name: pdf-autofiller
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: API_AUTH_ENABLED
        value: "true"
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: MAX_PDF_PAGES
        value: "200"
      - key: PDF_READ_TIMEOUT_SECONDS
        value: "20"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONPATH
        value: /app/src
    autoDeploy: true
