services:
  pdf-autofiller:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_AUTH_ENABLED: "false"
      LOG_LEVEL: INFO
      RATE_LIMIT_PER_MINUTE: "120"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
