name: Publish to PyPI

# Manual only until a PyPI trusted (or pending) publisher is configured.
# Do NOT auto-run on GitHub Release — that paints Releases red while
# GHCR + Release wheels already provide a working install path.
#
# When ready (one-time on https://pypi.org/manage/account/publishing/):
#   Owner: lindseystead
#   Repository: ai-pdf-autofiller
#   Workflow: publish-pypi.yml
#   Environment name: pypi
# then: gh workflow run publish-pypi.yml --ref main
# and optionally re-enable the release trigger in this file.
# See docs/RELEASE.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
