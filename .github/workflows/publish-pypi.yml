name: Publish to PyPI

# Runs automatically when a GitHub Release is published, and can also be
# triggered manually (e.g. to retry): gh workflow run publish-pypi.yml --ref main
#
# Uses PyPI Trusted Publishing (OIDC) — no API token. One-time setup on
# https://pypi.org/manage/account/publishing/:
#   Owner: lindseystead
#   Repository: ai-pdf-autofiller
#   Workflow: publish-pypi.yml
#   Environment name: pypi
# skip-existing makes re-runs for an already-uploaded version a no-op.
# See docs/RELEASE.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
