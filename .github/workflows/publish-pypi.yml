name: Publish to PyPI

# Trusted Publishing (OIDC) — no PYPI_API_TOKEN secret.
# Requires a matching publisher on PyPI (pending or project-level):
#   Owner: lindseystead
#   Repository: ai-pdf-autofiller
#   Workflow: publish-pypi.yml
#   Environment name: pypi
# See docs/RELEASE.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for Trusted Publishing; do not pass password/API token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the Environment name configured on PyPI (and the existing
    # GitHub Environment). Omitting this produced environment: MISSING and
    # invalid-publisher even when a publisher was intended.
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Safe for retries of the same version after a prior successful upload.
          skip-existing: true
