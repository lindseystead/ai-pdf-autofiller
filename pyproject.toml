[project]
name = "pdf-autofiller"
version = "0.3.0"
description = "PDF form filling service with deterministic field mapping"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Lindsey D. Stead" }]
license = "MIT"
keywords = ["pdf", "forms", "automation", "ai", "document-processing"]
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pdf-autofiller-api = "pdf_autofiller.api_service:run"

[tool.poetry]
packages = [
    { include = "pdf_autofiller", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
pypdf = "^6.6.2"
pydantic = "^2.0.0"
openai = "^1.0.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.0.0"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
